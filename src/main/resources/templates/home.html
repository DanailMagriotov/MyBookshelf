<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <script th:src="@{/js/home-actions.js}" defer></script>
</head>

<body th:data-authenticated="${userSession != null}"
      th:data-login-url="@{/login}">

<div class="scene">
    <img class="page-bg"
         th:src="@{/images/home-background.png}"
         alt="">

    <div class="home-stack">
        <div class="home-header">
            <p class="home-welcome" th:if="${username}">
                Welcome, <span th:text="${username}">user</span>!
            </p>

            <form class="logout-form" th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>

        <nav class="home-actions" aria-label="Home navigation">
        <div class="home-actions-row">
            <a class="home-action home-action--primary home-action--bookshelf" th:href="@{/home/actions/bookshelf}" data-home-action>
                <span class="home-action-icon" aria-hidden="true">
                    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 18h10v30H14zM14 18v30"/>
                        <path d="M17 22h4M17 28h4M17 34h4"/>
                        <path d="M26 14h10v34H26zM26 14v34"/>
                        <path d="M29 18h4M29 24h4M29 30h4"/>
                        <path d="M38 20h10v32H38zM38 20v32"/>
                        <path d="M41 24h4M41 30h4M41 36h4"/>
                    </svg>
                    <span class="home-action-badge" th:if="${bookshelfCount != null}" th:text="${bookshelfCount}">0</span>
                </span>
                <span class="home-action-label">my bookshelf</span>
            </a>

            <a class="home-action home-action--primary" th:href="@{/home/actions/add-book}" data-home-action>
                <span class="home-action-icon" aria-hidden="true">
                    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 32h7M11.5 28.5v7"/>
                        <path d="M20 16h24v32H20z"/>
                        <path d="M20 16v32"/>
                        <path d="M26 24h14M26 32h14M26 40h10"/>
                    </svg>
                </span>
                <span class="home-action-label">add new book</span>
            </a>

            <a class="home-action home-action--primary" th:href="@{/home/actions/send-book}" data-home-action>
                <span class="home-action-icon" aria-hidden="true">
                    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 16h24v32H10z"/>
                        <path d="M10 16v32"/>
                        <path d="M16 24h14M16 32h14M16 40h10"/>
                        <path d="M40 32h12M46 27l5 5-5 5"/>
                    </svg>
                </span>
                <span class="home-action-label">send book</span>
            </a>
        </div>

        <div class="home-actions-row">
            <a class="home-action home-action--primary" th:href="@{/home/actions/messages}" data-home-action>
                <span class="home-action-icon" aria-hidden="true">
                    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 20h40v28H12zM12 20l20 14 20-14"/>
                    </svg>
                </span>
                <span class="home-action-label">messages</span>
            </a>

            <a class="home-action home-action--primary"
               th:if="${isAdmin}"
               th:href="@{/home/actions/users}"
               data-home-action>
                <span class="home-action-icon" aria-hidden="true">
                    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24 26a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/>
                        <path d="M8 52c0-8 7-14 16-14s16 6 16 14"/>
                        <path d="M44 28a6 6 0 1 0 0-12 6 6 0 0 0 0 12z"/>
                        <path d="M36 52c0-6 5-10 12-10"/>
                    </svg>
                </span>
                <span class="home-action-label">users</span>
            </a>

            <a class="home-action home-action--primary" th:href="@{/my-profile}" data-home-action>
                <span class="home-action-icon" aria-hidden="true">
                    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                        <path d="M32 12a14 14 0 1 0 0 28 14 14 0 0 0 0-28zM12 52c2-10 10-16 20-16s18 6 20 16"/>
                    </svg>
                </span>
                <span class="home-action-label">my profile</span>
            </a>
        </div>
        </nav>
    </div>
</div>

<footer>
    © 2026 All rights reserved
</footer>

</body>
</html>

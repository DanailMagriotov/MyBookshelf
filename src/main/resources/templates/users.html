<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>users</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/my-bookshelf.css}">
    <link rel="stylesheet" th:href="@{/css/users.css}">
</head>

<body>

<div class="scene">
    <img class="page-bg"
         th:src="@{/images/book-list-background.png}"
         alt="">

    <div class="book-list-panel">
        <div class="book-list-content">
            <h1 class="book-list-title">users</h1>

            <div th:if="${successMessage}" class="alert alert-success book-list-alert" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-error book-list-alert" th:text="${errorMessage}"></div>

            <p class="book-list-counter">
                <span class="book-list-counter-label">Registered users:</span>
                <span class="book-list-counter-value" th:text="${totalUsers}">0</span>
            </p>

            <div class="book-list-table-wrap">
                <table class="book-list-table user-list-table">
                    <thead>
                    <tr>
                        <th>Username</th>
                        <th>First name</th>
                        <th>Last name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>City</th>
                        <th>Books</th>
                        <th class="book-list-actions-header"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.username}">Username</td>
                        <td th:text="${user.firstName != null ? user.firstName : '-'}">First name</td>
                        <td th:text="${user.lastName != null ? user.lastName : '-'}">Last name</td>
                        <td th:text="${user.email}">Email</td>
                        <td th:text="${user.role}">Role</td>
                        <td th:text="${user.region != null ? user.region : '-'}">City</td>
                        <td th:text="${user.bookCount}">0</td>
                        <td class="book-list-actions user-list-actions">
                            <div class="user-list-actions-inner">
                            <form th:if="${user.role.name() == 'USER'}"
                                  class="user-delete-form"
                                  th:action="@{/users/delete/{userId}(userId=${user.id}, page=${page})}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="button"
                                        class="book-delete-btn"
                                        data-delete-user-btn>Delete</button>
                            </form>
                            <form th:if="${user.role.name() == 'USER'}"
                                  class="user-role-form"
                                  th:action="@{/users/role/{userId}(userId=${user.id}, page=${page})}"
                                  method="post">
                                <input type="hidden" name="role" value="ADMIN">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="button"
                                        class="book-delete-btn book-open-btn"
                                        data-role-change-btn
                                        data-role-action="promote">Make admin</button>
                            </form>
                            <form th:if="${user.role.name() == 'ADMIN' and isMasterAdmin}"
                                  class="user-role-form"
                                  th:action="@{/users/role/{userId}(userId=${user.id}, page=${page})}"
                                  method="post">
                                <input type="hidden" name="role" value="USER">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="button"
                                        class="book-delete-btn"
                                        data-role-change-btn
                                        data-role-action="demote">Make user</button>
                            </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td class="book-list-empty" colspan="8">No users found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav class="book-list-pagination" aria-label="Users pagination">
                <a th:if="${hasPrevious}"
                   class="book-list-link"
                   th:href="@{/users(page=${page - 1}, size=${pageSize}, sort='username,asc')}">Previous page</a>
                <span th:if="${totalPages > 0}" class="book-list-page-info" th:text="|Page ${page + 1} of ${totalPages}|">Page 1 of 1</span>
                <a th:if="${hasNext}"
                   class="book-list-link"
                   th:href="@{/users(page=${page + 1}, size=${pageSize}, sort='username,asc')}">Next page</a>
            </nav>

            <p class="book-list-back">
                <a class="book-list-link" th:href="@{/home}">Back</a>
            </p>
        </div>
    </div>
</div>

<div id="roleChangeDialog" class="delete-dialog" hidden>
    <div class="delete-dialog__backdrop" data-role-dialog-dismiss></div>
    <div class="delete-dialog__panel" role="dialog" aria-modal="true" aria-labelledby="roleChangeDialogTitle">
        <p id="roleChangeDialogTitle" class="delete-dialog__message"></p>
        <div class="delete-dialog__actions">
            <button type="button" class="delete-dialog__btn delete-dialog__btn--confirm" id="roleChangeConfirmBtn">Yes</button>
            <button type="button" class="delete-dialog__btn delete-dialog__btn--cancel" id="roleChangeCancelBtn">No</button>
        </div>
    </div>
</div>

<div id="deleteUserDialog" class="delete-dialog" hidden>
    <div class="delete-dialog__backdrop" data-delete-dialog-dismiss></div>
    <div class="delete-dialog__panel" role="dialog" aria-modal="true" aria-labelledby="deleteUserDialogTitle">
        <p id="deleteUserDialogTitle" class="delete-dialog__message">
            Are you sure you want to delete this user account? This action cannot be undone.
        </p>
        <div class="delete-dialog__actions">
            <button type="button" class="delete-dialog__btn delete-dialog__btn--confirm" id="deleteUserConfirmBtn">Yes</button>
            <button type="button" class="delete-dialog__btn delete-dialog__btn--cancel" id="deleteUserCancelBtn">No</button>
        </div>
    </div>
</div>

<footer>
    © 2026 All rights reserved
</footer>

<script th:src="@{/js/users.js}"></script>

</body>
</html>

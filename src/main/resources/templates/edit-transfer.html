<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>edit return deadline</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/edit-transfer.css}">
</head>

<body>

<div class="scene">
    <img class="page-bg"
         th:src="@{/images/login-background.png}"
         alt="">

    <div class="form-container form-container--edit-transfer">
        <h1 class="auth-title">edit return deadline</h1>

        <form id="edit-transfer-form"
              class="auth-form edit-transfer-form"
              th:action="@{/my-bookshelf/edit/{id}(id=${bookId}, page=${page})}"
              method="post"
              th:object="${editTransferRequest}"
              novalidate>

            <div class="edit-transfer-book">
                <p class="edit-transfer-book-line">
                    <span class="field-label">Title</span>
                    <span class="edit-transfer-book-value" th:text="${bookTitle}">Title</span>
                </p>
                <p class="edit-transfer-book-line">
                    <span class="field-label">Author</span>
                    <span class="edit-transfer-book-value" th:text="${bookAuthor}">Author</span>
                </p>
            </div>

            <div class="form-group">
                <label class="field-label" for="returnDeadline">Return deadline</label>
                <input type="date"
                       id="returnDeadline"
                       th:field="*{returnDeadline}"
                       th:attr="min=${minReturnDate},data-min-date=${minReturnDate}">
                <p class="field-error" th:if="${#fields.hasErrors('returnDeadline')}" th:errors="*{returnDeadline}"></p>
                <p class="field-error client-field-error" data-client-error-for="returnDeadline" hidden></p>
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="edit-transfer-actions">
                <button type="submit" class="submit-btn">Update</button>
                <a class="edit-transfer-back-btn" th:href="@{/my-bookshelf(page=${page})}">Back</a>
            </div>
        </form>
    </div>
</div>

<footer>
    © 2026 All rights reserved
</footer>

<script th:src="@{/js/auth-form-validation.js}"></script>

</body>
</html>

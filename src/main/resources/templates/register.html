<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="scene">
    <img class="page-bg"
         th:src="@{/images/login-background.png}"
         alt="">

    <a class="brand-link" th:href="@{/}">my bookshelf</a>

    <div class="form-container form-container--register">
        <h1 class="auth-title">Create new account</h1>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form class="auth-form" th:action="@{/register}" method="post" th:object="${userRegRequest}">
            <div class="form-group">
                <input type="text" id="username" th:field="*{username}" placeholder="Username" required autofocus>
                <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            </div>
            <div class="form-group">
                <input type="password" id="password" th:field="*{password}" placeholder="Password" required>
                <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>
            <div class="form-group">
                <input type="email" id="email" th:field="*{email}" placeholder="Email" required>
                <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>
            <div class="form-group">
                <select id="region" th:field="*{region}" class="region-select" required>
                    <option value="">Select a city</option>
                    <option th:each="region : ${regions}"
                            th:value="${region}"
                            th:text="${region}">
                    </option>
                </select>
                <p class="field-error" th:if="${#fields.hasErrors('region')}" th:errors="*{region}"></p>
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="submit-btn">Register</button>
        </form>

        <p class="auth-link">
            Already have an account? <a th:href="@{/login}">Login</a>
        </p>
    </div>
</div>

<footer>
    © 2026 All rights reserved
</footer>

<script>
    function setFieldValidationMessage(input, emptyMessage, invalidMessage) {
        input.addEventListener('invalid', function () {
            if (input.validity.valueMissing) {
                input.setCustomValidity(emptyMessage);
            } else if (invalidMessage) {
                input.setCustomValidity(invalidMessage);
            }
        });
        input.addEventListener('input', function () {
            input.setCustomValidity('');
        });
        if (input.tagName === 'SELECT') {
            input.addEventListener('change', function () {
                input.setCustomValidity('');
            });
        }
    }

    setFieldValidationMessage(document.getElementById('username'), 'Please enter a username');
    setFieldValidationMessage(document.getElementById('password'), 'Please enter a password');
    setFieldValidationMessage(
        document.getElementById('email'),
        'Please enter a valid email',
        'Please enter a valid email'
    );
    setFieldValidationMessage(document.getElementById('region'), 'Please select a city');
</script>

</body>
</html>

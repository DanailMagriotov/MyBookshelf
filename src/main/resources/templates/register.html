<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="scene">
    <img class="page-bg"
         th:src="@{/images/login-background.png}"
         alt="">

    <a class="brand-link" th:href="@{/}">my bookshelf</a>

    <div class="form-container form-container--register">
        <h1 class="auth-title">Create new account</h1>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form id="register-form" class="auth-form" th:action="@{/register}" method="post" th:object="${userRegRequest}">
            <div class="form-group">
                <label class="sr-only" for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" placeholder="Username" required autofocus>
                <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                <p class="field-error client-field-error" data-client-error-for="username" hidden></p>
            </div>
            <div class="form-group">
                <label class="sr-only" for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Password" required>
                <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                <p class="field-error client-field-error" data-client-error-for="password" hidden></p>
            </div>
            <div class="form-group">
                <label class="sr-only" for="email">Email</label>
                <input type="text" id="email" th:field="*{email}" placeholder="Email" autocomplete="email" required>
                <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                <p class="field-error client-field-error" data-client-error-for="email" hidden></p>
            </div>
            <div class="form-group">
                <label class="sr-only" for="region">City</label>
                <select id="region" th:field="*{region}" class="region-select" required>
                    <option value="">Select a city</option>
                    <option th:each="region : ${regions}"
                            th:value="${region}"
                            th:text="${region}">
                    </option>
                </select>
                <p class="field-error" th:if="${#fields.hasErrors('region')}" th:errors="*{region}"></p>
                <p class="field-error client-field-error" data-client-error-for="region" hidden></p>
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="submit-btn">Register</button>
        </form>

        <p class="auth-link">
            Already have an account? <a th:href="@{/login}">Login</a>
        </p>
    </div>
</div>

<footer>
    © 2026 All rights reserved
</footer>

<script th:src="@{/js/auth-form-validation.js}"></script>

</body>
</html>

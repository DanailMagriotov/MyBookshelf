<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>edit book</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/add-book.css}">
</head>

<body>

<div class="scene">
    <img class="page-bg"
         th:src="@{/images/transfer-background.png}"
         alt="">

    <div class="add-book-panel">
        <div class="form-container form-container--add-book">
            <h1 class="auth-title">edit book</h1>

            <form class="auth-form add-book-form"
                  th:action="@{/edit-book/{id}(id=${bookId}, page=${page})}"
                  method="post"
                  th:object="${editBookRequest}">
                <div class="form-grid">
                    <div class="form-group form-group--full">
                        <label class="field-label" for="title">Title</label>
                        <input type="text" id="title" th:field="*{title}" required>
                        <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
                    </div>

                    <div class="form-group form-group--full">
                        <label class="field-label" for="author">Author</label>
                        <input type="text" id="author" th:field="*{author}" required>
                        <p class="field-error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></p>
                    </div>

                    <div class="form-group form-group--full">
                        <label class="field-label" for="description">Description</label>
                        <textarea id="description" th:field="*{description}" rows="3"></textarea>
                        <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
                    </div>

                    <div class="form-group">
                        <label class="field-label" for="category">Category</label>
                        <select id="category" th:field="*{category}" class="region-select" required>
                            <option value="">Select a category</option>
                            <option th:each="category : ${categories}"
                                    th:value="${category}"
                                    th:text="${category}"
                                    th:selected="${category == editBookRequest.category}">
                            </option>
                        </select>
                        <p class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>
                    </div>

                    <div class="form-group">
                        <label class="field-label" for="price">Price</label>
                        <input type="number" id="price" th:field="*{price}" step="0.01" min="0">
                        <p class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
                    </div>
                </div>

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="submit-btn">Save changes</button>
            </form>

            <p class="auth-link">
                <a th:href="@{/my-bookshelf(page=${page})}">Back to my bookshelf</a>
            </p>
        </div>
    </div>
</div>

<footer>
    © 2026 All rights reserved
</footer>

</body>
</html>

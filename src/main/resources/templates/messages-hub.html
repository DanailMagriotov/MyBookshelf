<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>messages</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/messages-hub.css}">
</head>

<body>

<div class="scene">
    <img class="page-bg"
         th:src="@{/images/login-background.png}"
         alt="">

    <div class="messages-hub-panel">
        <h1 class="auth-title messages-hub-floating-title">messages</h1>

        <div class="form-container form-container--messages-hub">
            <div class="messages-hub-title-spacer" aria-hidden="true"></div>

            <div th:if="${serviceError}" class="alert alert-error messages-hub-alert" th:text="${serviceError}"></div>

            <nav class="messages-hub-actions" aria-label="Messages navigation">
                <a class="messages-hub-action" th:href="@{/messages/new}">
                    <span class="messages-hub-action-icon" aria-hidden="true">
                        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 12h28v40H18z"/>
                            <path d="M24 26h16M24 32h16M24 38h16"/>
                        </svg>
                    </span>
                    <span class="messages-hub-action-label">new message</span>
                </a>

                <div class="messages-hub-inbox-group">
                    <p class="messages-hub-unread-label">
                        Unread messages: <span th:text="${unreadCount}">0</span>
                    </p>
                    <a class="messages-hub-action" th:href="@{/messages/inbox}">
                        <span class="messages-hub-action-icon" aria-hidden="true">
                            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8 32h10M13 27l5 5-5 5"/>
                                <path d="M22 20h34v26H22z"/>
                                <path d="M22 20l17 12 17-12"/>
                            </svg>
                            <span class="messages-hub-action-badge"
                                  th:if="${inboxCount != null and inboxCount > 0}"
                                  th:text="${inboxCount}">0</span>
                        </span>
                        <span class="messages-hub-action-label">inbox</span>
                    </a>
                </div>

                <a class="messages-hub-action" th:href="@{/messages/sent}">
                    <span class="messages-hub-action-icon" aria-hidden="true">
                        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10 20h34v26H10z"/>
                            <path d="M10 20l17 12 17-12"/>
                            <path d="M48 32h10M53 27l5 5-5 5"/>
                        </svg>
                    </span>
                    <span class="messages-hub-action-label">sent</span>
                </a>
            </nav>

            <p class="auth-link">
                <a th:href="@{/home}">Back to home</a>
            </p>
        </div>
    </div>
</div>

<footer>
    © 2026 All rights reserved
</footer>

</body>
</html>

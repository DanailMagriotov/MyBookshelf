<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="scene">
    <img class="page-bg"
         th:src="@{/images/login-background.png}"
         alt="">

    <a class="brand-link" th:href="@{/}">my bookshelf</a>

    <div class="form-container">
        <h1 class="auth-title">Sign in to your account</h1>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form id="login-form" class="auth-form" th:action="@{/login/submit}" method="post" th:object="${loginRequest}">
            <div class="form-group">
                <label class="sr-only" for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" placeholder="Username" autofocus>
                <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                <p class="field-error client-field-error" data-client-error-for="username" hidden></p>
            </div>
            <div class="form-group">
                <label class="sr-only" for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Password">
                <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                <p class="field-error client-field-error" data-client-error-for="password" hidden></p>
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="submit-btn">Login</button>
        </form>

        <p class="auth-link">
            Don't have an account? <a th:href="@{/register}">Register</a>
        </p>
    </div>
</div>

<footer>
    © 2026 All rights reserved
</footer>

<script th:src="@{/js/auth-form-validation.js}"></script>

</body>
</html>

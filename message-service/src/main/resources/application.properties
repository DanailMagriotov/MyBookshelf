spring.application.name=message-service

server.port=8081

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/my_bookshelf_messages?createDatabaseIfNotExist=true
spring.datasource.username=${MY_USERNAME}
spring.datasource.password=${MY_PASSWORD}

app.scheduler.message-stats-cron=0 0 2 * * *
app.scheduler.cache-eviction-delay-ms=180000
